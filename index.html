<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#102d84">
  <title>블로그 챌린지 · 로그인</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="card login-card">
      <span class="eyebrow">YOUR NEXT CHAPTER</span>
      <h1>✍️ <span id="appTitle">블로그 챌린지</span></h1>
      <p class="login-intro">작은 기록이 만드는<br><strong>나의 새로운 가능성.</strong></p>
      <img class="login-mascot" src="assets/challenge-mascot.svg" width="960" height="640" alt="노란 노트북으로 글을 쓰는 라벤더색 아기 새" decoding="async" fetchpriority="high">
      <nav class="tabs login-tabs" role="tablist" aria-label="로그인 종류">
        <button role="tab" type="button" id="tabMember" data-login="member" aria-selected="true">🙋 챌린지원 로그인</button>
        <button role="tab" type="button" id="tabAdmin" data-login="admin" aria-selected="false">🛠 관리자 로그인</button>
      </nav>

      <section data-login-panel="member">
        <p class="faint" style="margin-top:0">관리자에게 받은 아이디와 비밀번호로 로그인하세요.</p>
        <form id="loginForm" autocomplete="on">
          <label class="field"><span>아이디</span>
            <input type="text" id="loginId" name="username" autocomplete="username" placeholder="예) 홍길동" required>
          </label>
          <label class="field"><span>비밀번호</span>
            <input type="password" id="loginPw" name="password" autocomplete="current-password" required>
          </label>
          <button class="btn primary block" id="loginBtn" type="submit">로그인</button>
        </form>
      </section>

      <section data-login-panel="admin" hidden>
        <p class="faint" style="margin-top:0">관리자로 등록된 Google 계정으로 로그인하세요.</p>
        <button class="btn primary block" id="googleBtn" type="button">
          <span class="g-icon"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg></span>
          Google 계정으로 관리자 로그인
        </button>
      </section>

      <p class="err" id="loginErr" style="margin-top:10px"></p>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
